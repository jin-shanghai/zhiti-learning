function escapeHTML(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pct(num,den){return den?Math.round(100*num/den):0}
function historyFor(id){return data.history[id]||[]}
function practiced(id){return historyFor(id).length>0}
function lastCorrect(id){let a=historyFor(id);return a.length?!!a[a.length-1].ok:null}
function needsReview(id){const h=historyFor(id);return h.some(x=>!x.ok) && !(h.length>=2&&h[h.length-1].ok&&h[h.length-2].ok)}
function mastered(id){let h=historyFor(id);return h.length>=2&&h.slice(-2).every(x=>x.ok)}
function everCorrect(id){return !!data.correctEver?.[id]||historyFor(id).some(x=>x.ok)}
function totalBankSize(){return QUESTIONS.length+JUDGMENTS.length+(data.multiQuestions||[]).length}
function practiceCountToday(){return Object.values(data.history).flat().filter(x=>new Date(x.at).toLocaleDateString('en-CA')===today()).length}
function stats(){let all=[...QUESTIONS,...JUDGMENTS,...(data.multiQuestions||[])],attempts=all.flatMap(q=>historyFor(q.id));return {studied:all.filter(q=>practiced(q.id)).length,correctUnique:all.filter(q=>everCorrect(q.id)).length,mastered:all.filter(q=>mastered(q.id)).length,wrong:all.filter(q=>needsReview(q.id)).length,correct:attempts.filter(x=>x.ok).length,total:attempts.length,accuracy:pct(attempts.filter(x=>x.ok).length,attempts.length),today:practiceCountToday(),bankTotal:all.length}}
function streak(){const days=new Set(Object.values(data.history).flat().map(x=>new Date(x.at).toLocaleDateString('en-CA')));let cur=new Date();let n=0;if(!days.has(today()))cur.setDate(cur.getDate()-1);for(let i=0;i<500;i++){if(!days.has(cur.toLocaleDateString('en-CA')))break;n++;cur.setDate(cur.getDate()-1)}return n}

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function getFilteredSessionIds(type,val){
 const mc=QUESTIONS.map(q=>q.id),judge=JUDGMENTS.map(q=>q.id),multi=(data.multiQuestions||[]).map(q=>q.id),both=[];for(let i=0;i<Math.max(mc.length,judge.length);i++){if(mc[i]!==undefined)both.push(mc[i]);if(judge[i]!==undefined)both.push(judge[i])}
 const filterKind=(ids,kind)=>kind==='mc'?ids.filter(x=>typeof x==='number'):kind==='judge'?ids.filter(x=>typeof x==='string'&&x.startsWith('J')):kind==='multi'?ids.filter(x=>typeof x==='string'&&x.startsWith('M')):ids;
 const filterCategory=(ids,category)=>!category||category==='all'?ids:ids.filter(x=>byId(x)?.category===category);
 if(type==='sequential'||type==='random'){
  const kind=['mc','judge','mixed'].includes(val?.kind)?val.kind:'mc',pool=kind==='mc'?mc:kind==='judge'?judge:both,size=val?.size||'all';
  if(type==='random'){
   const n=size==='all'?pool.length:Math.min(pool.length,Number(size)||pool.length);
   if(kind==='mixed')return shuffle([...shuffle(mc).slice(0,Math.ceil(n/2)),...shuffle(judge).slice(0,Math.floor(n/2))]);
   return shuffle(pool).slice(0,n);
  }
  const pos=kind==='mc'?data.seqCursor:kind==='judge'?data.seqCursorJudge:data.seqCursorMixed;
  return [...pool.slice(pos%pool.length),...pool.slice(0,pos%pool.length)].slice(0,size==='all'?pool.length:Math.min(pool.length,Number(size)||pool.length));
 }
 if(type==='choice'){let pool=QUESTIONS.filter(q=>!val||val==='all'||q.category===val);return shuffle(pool).sort((a,b)=>historyFor(a.id).length-historyFor(b.id).length).slice(0,choiceSize).map(q=>q.id)}
 if(type==='judgment'){let pool=JUDGMENTS.filter(q=>!val||val==='all'||q.category===val);return shuffle(pool).sort((a,b)=>historyFor(a.id).length-historyFor(b.id).length).slice(0,judgeSize).map(q=>q.id)}
 if(type==='multi')return shuffle(multi).sort((a,b)=>historyFor(a).length-historyFor(b).length).slice(0,30);
 if(type==='new')return mc.filter(id=>!practiced(id)).slice(0,15);
 if(type==='mistakes'){
  let ids=filterCategory([...mc,...judge,...multi].filter(needsReview),val?.category||'all');
  return filterKind(ids,val?.kind||'mixed').sort((a,b)=>(historyFor(a).at(-1)?.at||0)-(historyFor(b).at(-1)?.at||0)).slice(0,50);
 }
 if(type==='bookmarks'){
  let ids=filterCategory([...mc,...judge,...multi].filter(x=>data.bookmarks.includes(x)),val?.category||'all');
  return filterKind(ids,val?.kind||'mixed');
 }
 if(type==='category'){
  const cat=typeof val==='string'?val:val?.category,kind=typeof val==='object'?(val?.kind||'mixed'):'mc';
  return filterKind([...mc,...judge].filter(x=>byId(x).category===cat),kind);
 }
 if(type==='pattern')return mc.filter(x=>byId(x).pattern===val);
 if(type==='single')return [val];
 if(type==='mock'){
  if(mockKind==='mixed')return shuffle([...shuffle(mc).slice(0,Math.ceil(mockSize/2)),...shuffle(judge).slice(0,Math.floor(mockSize/2))]);
  return shuffle(mockKind==='mc'?mc:judge).slice(0,mockSize)
 }
 return mc
}


function sessionName(s){if(!s)return '';const kindText={mc:'单选题',judge:'判断题',multi:'多选题',mixed:'单选＋判断'}[s.kind||'mc']||'单选题';const cat=s.filter&&typeof s.filter==='object'?s.filter.category:s.filter;return ({sequential:`顺序练习 · ${kindText}`,random:`随机练习 · ${kindText}`,choice:cat&&cat!=='all'?`单选题 · ${cat}`:'单选题训练',new:'新题探索',multi:'多选题训练',mistakes:`错题强化${cat&&cat!=='all'?` · ${cat}`:''} · ${kindText}`,bookmarks:`收藏练习${cat&&cat!=='all'?` · ${cat}`:''} · ${kindText}`,judgment:cat&&cat!=='all'?`判断题 · ${cat}`:'判断题训练',category:`专项 · ${cat} · ${kindText}`,pattern:`思维 · ${cat}`,single:'单题练习',mock:`模拟考试 · ${kindText}`})[s.type]||'练习'}
function startSession(type,filter){const ids=getFilteredSessionIds(type,filter);if(!ids.length){toast(type==='new'?'原创演示单选题已练完，可进行随机复习':'这个题组目前没有题目，先开始其他练习吧');return}if(data.session&&!data.session.finished&&Object.keys(data.session.answers||{}).length>0&&!confirm('当前有未完成的'+sessionName(data.session)+'，要开始新的训练吗？\n已做题历史仍会保留，但本轮记录尚未生成报告。'))return;
 let kind=(type==='sequential'||type==='random')?(filter?.kind||'mc'):type==='choice'?'mc':type==='judgment'?'judge':type==='multi'?'multi':type==='mock'?mockKind:type==='single'?(String(filter).startsWith('J')?'judge':String(filter).startsWith('M')?'multi':'mc'):type==='category'||type==='mistakes'||type==='bookmarks'?(filter?.kind||'mixed'):'mc';
 data.session={type,filter:filter||null,kind,ids,idx:0,answers:{},startedAt:Date.now(),duration:type==='mock'?mockMinutes*60000:null,finished:false};hintOpen=false;persist();setPage('practice')}
function resumeSession(){if(data.session&&!data.session.finished)setPage('practice');else setPage('trainingSetup')}
function kindLabel(kind){return ({mc:'单选题',judge:'判断题',mixed:'单选＋判断混合'})[kind]||'单选题'}

gKind)} · ${trainingSize==='all'?total:trainingSize}题。${trainingOrder==='sequential'?'顺序进度按题型分别记录，互不干扰。':'随机练习可能抽到以前做过的题。'}</div><div class="action-row" style="margin-top:18px"><button class="btn btn-primary" onclick="startSession(trainingOrder,{kind:trainingKind,size:trainingSize})">▶ 开始${kindLabel(trainingKind)}训练</button>${data.session&&!data.session.finished?'<button class="btn" onclick="resumeSession()">继续未完成练习 →</button>':''}</div></div>`}

function downloadMultiTemplate(){const template={questions:[],fields:{q:'必填：题干',options:'必填：3~8个选项的数组',answer:'必填：两个及以上字母，如 ["A","C"]',category:'可选：知识板块',explanation:'可选：原题解析'}};downloadFile('知题_多选题导入空模板.json',JSON.stringify(template,null,2));toast('已下载空模板，不包含题目')}
function normalizeMultiQuestions(parsed){const rows=Array.isArray(parsed)?parsed:parsed?.questions;if(!Array.isArray(rows)||rows.length===0)throw Error('文件内没有可导入的多选题；空模板不会被当成成功导入。');if(rows.length>1000)throw Error('单次最多导入1000道题');const ids=new Set();return rows.map((x,i)=>{if(!x||typeof x!=='object')throw Error(`第${i+1}题格式无效`);const id=x.id==null?'M'+String(i+1).padStart(3,'0'):String(x.id);if(!/^M\d{3,5}$/.test(id)||ids.has(id))throw Error(`第${i+1}题题号重复或格式错误（应为M001等）`);ids.add(id);const q=String(x.q||'').trim();const options=x.options;if(!q||q.length>2000||!Array.isArray(options)||options.length<3||options.length>8||options.some(o=>typeof o!=='string'||!o.trim()))throw Error(`第${i+1}题题干或选项不完整`);const ans=Array.isArray(x.answer)?x.answer.join(''):String(x.answer||'');const letters=[...ans.toUpperCase().replace(/[\s,，、]/g,'')];const allowed='ABCDEFGH'.slice(0,options.length);if(letters.length<2||letters.length>options.length||new Set(letters).size!==letters.length||letters.some(c=>!allowed.includes(c)))throw Error(`第${i+1}题正确答案无效：请提供两个及以上有效字母`);return {id,q,options:options.map(o=>o.trim()),answer:letters.sort().join(''),category:String(x.category||'未分类').slice(0,80),explanation:String(x.explanation||'').slice(0,3000),pattern:'多选判断',step:'逐项核对每个选项，选出全部正确项后再提交',kind:'multi',source:'用户导入多选题库'}})}
function downloadCustomTemplate(kind){const file=kind==='mc'?'知题_单选题库空模板.json':'知题_判断题库空模板.json';const example=kind==='mc'?{questions:[{q:'请填写题干',options:['选项A','选项B'],answer:'A',category:'默认专题',explanation:''}]}:{questions:[{q:'请填写判断题题干',answer:'正确',category:'默认专题',explanation:''}]};downloadFile(file,JSON.stringify(example,null,2));toast('已下载模板，请替换示例字段后导入')}
async function importCustomBank(event,kind){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 try{
  if(file.size>3*1024*1024)throw Error('文件超过3MB，请拆分导入');
  const savedCounts=backupCounts(data);if(savedCounts.attempts||savedCounts.bookmarks||savedCounts.sessions||savedCounts.exams||savedCounts.comments||savedCounts.active)throw Error('当前浏览器已有学习记录。请先导出学习备份，再在「数据与设置」清空记录后导入新题库，以免题号与旧记录错配。');
  const parsed=JSON.parse(await file.text());const rows=Array.isArray(parsed)?parsed:parsed.questions;
  if(!Array.isArray(rows)||!rows.length||rows.length>300)throw Error('文件应为1–300道题的JSON数组，或包含 questions 数组的对象');
  const seen=new Set();
  const normalized=rows.map((raw,index)=>{
   const q=String(raw.q||raw.question||'').trim();const options=Array.isArray(raw.options)?raw.options.map(x=>String(x).trim()):[];const category=String(raw.category||'默认专题').trim().slice(0,80);
   if(!q||(kind==='mc'&&(options.length<2||options.length>8||options.some(x=>!x))))throw Error(`第${index+1}题缺少题干或有效选项`);
   const answer=String(raw.answer??'').trim().toUpperCase();
   if(kind==='mc'){
    if(options.length<2||! /^[A-H]$/.test(answer)||'ABCDEFGH'.indexOf(answer)>=options.length)throw Error(`第${index+1}题答案应为选项字母 A–H`);
    return {id:index+1,q,options,answer,explanation:String(raw.explanation||''),pattern:String(raw.pattern||'概念辨析'),step:String(raw.step||'先识别题目考查的核心知识点'),category,risk:null};
   }
   let judgeAnswer=answer;if(['正确','TRUE','对','是'].includes(answer))judgeAnswer='A';if(['错误','FALSE','错','否'].includes(answer))judgeAnswer='B';
   if(!['A','B'].includes(judgeAnswer))throw Error(`第${index+1}题判断答案应为 A/正确 或 B/错误`);
   return {id:`J${String(index+1).padStart(3,'0')}`,sourceNo:index+1,q,options:['正确','错误'],answer:judgeAnswer,answerText:judgeAnswer==='A'?'正确':'错误',explanation:String(raw.explanation||''),category,risk:null};
  });
  if(kind==='mc'){
   if(!confirm(`即将在本机导入${normalized.length}道单选题，并替换当前单选演示题。确认题库内容有合法使用权后继续。学习记录不会上传。`))return;
   localStorage.setItem(BANK_MC_KEY,JSON.stringify(normalized));QUESTIONS=normalized;CATEGORIES=[...new Set([...QUESTIONS,...JUDGMENTS].map(q=>q.category).filter(Boolean))];
  }else{
   if(!confirm(`即将在本机导入${normalized.length}道判断题，并替换当前判断演示题。确认题库内容有合法使用权后继续。学习记录不会上传。`))return;
   localStorage.setItem(BANK_JUDGE_KEY,JSON.stringify(normalized));JUDGMENTS=normalized;JUDGMENT_MAP=Object.fromEntries(JUDGMENTS.map(q=>[q.id,q]));CATEGORIES=[...new Set([...QUESTIONS,...JUDGMENTS].map(q=>q.category).filter(Boolean))];
  }
  render();alert(`导入成功：${normalized.length}道题已保存在当前浏览器。请保留原始JSON作为题库备份；学习数据备份不包含题库文件。`);
 }catch(e){alert('题库导入失败，原题库未修改：'+e.message)}
}
async function importMultiBank(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过2MB，请拆分导入');const parsed=JSON.parse(await file.text());const incoming=normalizeMultiQuestions(parsed);const current=data.multiQuestions||[];const known=new Map(current.map(q=>[q.id,q]));const additions=[];for(const q of incoming){const prev=known.get(q.id);if(prev){if(prev.q!==q.q||prev.answer!==q.answer||JSON.stringify(prev.options)!==JSON.stringify(q.options))throw Error(`题号${q.id}与已有题目不一致，为保护历史记录已拒绝覆盖`)}else additions.push(q)}if(!additions.length){alert('此文件中的题目已经全部存在，没有新增内容，也没有覆盖旧数据。');return}if(!confirm(`校验通过：文件${incoming.length}道，其中新增${additions.length}道。\n确定将新题保存到本机多选题库？`))return;safelySaveStudyData({...data,multiQuestions:[...current,...additions]});setPage('multiBank');alert(`导入成功：新增${additions.length}道多选题，当前共${data.multiQuestions.length}道。请在数据与设置中导出学习备份。`)}catch(e){alert('多选题库导入失败，原题库未修改：'+e.message)}}

function renderPatterns(){return `<div class="eyebrow">THINKING FRAMEWORK</div><h1 class="page-title">掌握7种命题思维</h1><p class="page-desc">先学会如何判断，再刷题。每种规律可用于理解导入题目，可立即专项练习。</p><div class="note" style="margin-bottom:19px"><span>✦</span><span>这7类是为理解题目而做的训练归类，并非出题机构公布的命题规则；答题时仍以具体知识和题干限定为准。</span></div><div class="modules">${PATTERNS.map((c,i)=>{let p=PATTERN_INFO[c],all=QUESTIONS.filter(q=>q.pattern===c);return `<div class="panel pattern-card"><div class="head"><div class="number">${i+1}</div><h3>${c}</h3><span class="tag" style="margin-left:auto">${all.length}题</span></div><p>${p.desc}</p><div class="rule">✓ ${p.rule}</div><div style="font-size:12px;color:#607a79;margin:14px 0 17px">训练方法：${p.tip}</div><button class="btn btn-light btn-sm" onclick="startSession('pattern',${JSON.stringify(c)})">训练这一类 →</button></div>`}).join('')}</div><div class="panel boxpad" style="margin-top:17px"><h3 class="dash-title">正确使用答题技巧</h3><ul class="insight-list"><li>先掌握知识，答题技巧用于快速筛选和核查，不应代替概念理解。</li><li>否定词、绝对词、工具名都只是线索，不能保证对应选项一定正确或错误。</li><li>答案字母分布可以做统计，但不能用来预测另一套试卷的正确字母。</li><li>遇到有争议的题目，应核对可靠资料并记录判断依据。</li></ul></div>`}
function renderPoolPage(kind){
 const isWrong=kind==='mistakes';
 const raw=[...QUESTIONS,...JUDGMENTS,...(data.multiQuestions||[])].map(q=>q.id).filter(isWrong?needsReview:id=>data.bookmarks.includes(id));
 const categoryFiltered=raw.filter(id=>reviewCategory==='all'||byId(id).category===reviewCategory);
 const ids=categoryFiltered.filter(id=>reviewKind==='all'||(reviewKind==='mc'?typeof id==='number':reviewKind==='judge'?typeof id==='string'&&id.startsWith('J'):typeof id==='string'&&id.startsWith('M')));
 const pages=Math.max(1,Math.ceil(ids.length/25));

function categoryPendingCount(category,mode){return getFilteredSessionIds('mistakes',{category,kind:reportPracticeKind(mode)}).length}

function renderSessionResult(){const r=sessionData();if(!r)return '<div class="empty"><h3>还没有练习报告</h3><button class="btn btn-primary" onclick="startSession(\'new\')">开始练习</button></div>';const rows=breakdown(r),score=sessionAccuracy(r),wrong=r.wrongIds||[];return `<div class="eyebrow">SESSION REPORT · 已自动保存</div><h1 class="page-title">本轮学习报告</h1><p class="page-desc">${escapeHTML(r.name)} · ${new Date(r.at).toLocaleString('zh-CN')} · 用时 ${Math.max(1,Math.ceil((r.durationMs||0)/60000))} 分钟</p><div class="report-hero panel"><div class="big-score">${score}<small>%</small></div><div class="report-hero-copy"><h3>${score>=90?'掌握得不错，保持训练':score>=70?'表现稳定，重点复习薄弱项':'找到薄弱知识点，下一轮就能针对提升'}</h3><div class="result-stat"><span>已答 <b>${r.answered}</b></span><span>答对 <b>${r.correct}</b></span><span>答错 <b>${r.answered-r.correct}</b></span>${r.total-r.answered?`<span>未答 <b>${r.total-r.answered}</b></span>`:''}</div><div class="smallprint">${r.mode==='mock'?'模拟成绩=答对题数÷试卷总题数；未答题计0分、不自动归入错题本':'正确率以本轮实际作答题数计算，未作答不计入正确率'} · 依据题库参考答案评分</div></div></div><div class="panel boxpad" style="margin-top:17px"><div class="section-head" style="margin-top:0"><h3>本轮各板块正确率</h3><span class="smallprint">按实际答题统计</span></div>${rows.length?renderBreakdown(rows):'<div class="empty">还没有作答记录</div>'}<div class="note" style="margin-top:14px">练习题量较少的板块，正确率波动可能较大；优先关注错误题数及知识点。</div></div><div class="section-head"><h3>本轮错题 · ${wrong.length}道</h3><div><button class="btn btn-sm" onclick="setPage('report')">查看总学习报告 →</button></div></div>${wrong.length?renderQuestionRows(wrong.slice(0,80)):'<div class="note">本轮所有已作答题目均正确。</div>'}${r.unanswered?.length?`<p class="smallprint">另有 ${r.unanswered.length} 道未作答题，不记入错题。</p>`:''}<div class="panel boxpad" style="margin-top:17px"><div class="section-head" style="margin-top:0"><h3>本轮已答题目 · 复盘和评论</h3><span class="smallprint">答对的题也可以写笔记</span></div><button class="btn btn-sm" onclick="showAllReview=!showAllReview;render()">${showAllReview?'收起':'展开'} ${Object.keys(r.answers||{}).length} 道已答题</button>${showAllReview?renderQuestionRows(Object.keys(r.answers||{}).map(id=>/^\d+$/.test(id)?Number(id):id)):''}</div><div class="panel boxpad" style="margin-top:18px"><b>下一步学习建议</b><p style="font-size:12px;color:var(--muted)">${rows.length&&rows[0].wrong?`本轮「${escapeHTML(rows[0].category)}」有 ${rows[0].wrong} 道错题，建议优先复习这个板块。`:'继续保持练习，并尝试其他知识专题。'}</p><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn btn-primary" onclick="${r.mode==='judgment'?`startSession('judgment','all')`:`startSession('mistakes')`}">${r.mode==='judgment'?'再练一组判断题':'强化错题'}</button><button class="btn" onclick="setPage('report')">查看累计学习分析</button></div></div>`}

function renderExamResult(){return renderSessionResult()}
function getVisibleBrowseIds(){let word=searchTerm.trim().toLowerCase();return QUESTIONS.filter(q=>{if(browseFilter==='wrong'&&!needsReview(q.id))return false;if(browseFilter==='star'&&!data.bookmarks.includes(q.id))return false;if(browseFilter==='risk'&&!q.risk)return false;if(browseFilter==='new'&&practiced(q.id))return false;if(browseCategory!=='all'&&q.category!==browseCategory)return false;if(word&&!(`${q.id} ${q.q} ${q.options.join(' ')} ${q.explanation}`.toLowerCase().includes(word)))return false;return true}).map(q=>q.id)}
function renderBrowse(){let ids=getVisibleBrowseIds(),pages=Math.ceil(ids.length/20);browsePage=Math.max(1,Math.min(browsePage,pages||1));return `<div class="eyebrow">QUESTION BANK</div><h1 class="page-title">单选题库 · ${QUESTIONS.length}题</h1><p class="page-desc">搜索考点、查看原题及解析、收藏重要题目。查看题目、解析、收藏和个人评论。</p><div class="search-row"><input class="search" id="question-search" placeholder="搜索题号 / 关键词 / 选项 / 解析…" value="${escapeHTML(searchTerm)}" oninput="searchTerm=this.value;browsePage=1;refreshBrowseResults()"/><select class="select" onchange="browseFilter=this.value;browsePage=1;refreshBrowseResults()"><option value="all" ${browseFilter==='all'?'selected':''}>全部题目</option><option value="wrong" ${browseFilter==='wrong'?'selected':''}>待强化错题</option><option value="star" ${browseFilter==='star'?'selected':''}>已收藏</option><option value="risk" ${browseFilter==='risk'?'selected':''}>需核查</option><option value="new" ${browseFilter==='new'?'selected':''}>未做过</option></select><select class="select" onchange="browseCategory=this.value;browsePage=1;refreshBrowseResults()"><option value="all">所有专题</option>${CATEGORIES.map(c=>`<option value="${escapeHTML(c)}" ${browseCategory===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select></div><div id="browse-results">${renderBrowseResults(ids)}</div>`}
function refreshBrowseResults(){document.getElementById('browse-results').innerHTML=renderBrowseResults(getVisibleBrowseIds())}
function renderBrowseResults(ids){if(!ids.length)return '<div class="empty"><h3>没有匹配的题目</h3><p>试着更换搜索词或筛选条件。</p></div>';const pages=Math.ceil(ids.length/20);browsePage=Math.max(1,Math.min(browsePage,pages));return `<div style="font-size:12px;color:var(--muted);margin:0 2px 10px">找到 ${ids.length} 道题 · 第 ${browsePage} / ${pages} 页</div>${renderQuestionRows(ids.slice((browsePage-1)*20,browsePage*20))}${pages>1?`<div style="display:flex;align-items:center;justify-content:center;gap:13px;margin-top:23px"><button class="btn btn-sm" onclick="browsePage--;refreshBrowseResults();scrollTo({top:130,behavior:'smooth'})" ${browsePage===1?'disabled':''}>← 上一页</button><span style="font-size:12px;color:var(--muted)">${browsePage} / ${pages}</span><button class="btn btn-sm" onclick="browsePage++;refreshBrowseResults();scrollTo({top:130,behavior:'smooth'})" ${browsePage===pages?'disabled':''}>下一页 →</button></div>`:''}`}
function renderQuestionRows(ids){return ids.map(id=>{const q=byId(id);if(!q)return '';const expand=String(expandedRow)===String(id),isJudge=q.kind==='judge',isMulti=q.kind==='multi';return `<div class="q-row" id="question-row-${escapeHTML(String(id))}"><div class="q-row-head"><span class="q-row-index">#${escapeHTML(id)}</span><div class="q-row-title">${escapeHTML(q.q)}</div></div><div class="q-row-summary"><span>${escapeHTML(q.category)}</span><span>·</span><span>${isJudge?'判断题':isMulti?'多选题 · 用户导入':'单选题 · '+escapeHTML(q.pattern)}</span>${q.risk?'<span class="tag warn">需核查</span>':''}${needsReview(id)?'<span class="tag">待强化</span>':''}${(data.comments[id]||[]).length?`<span>☷ ${data.comments[id].length}条个人评论</span>`:''}</div>${expand?`<div class="q-expanded">${q.options.map((opt,i)=>`<div class="full-opt">${isJudge?'':KEYS[i]+'、'}${escapeHTML(opt)} ${(isMulti?q.answer.includes(KEYS[i]):q.answer===KEYS[i])?'<b>✓ 参考答案</b>':''}</div>`).join('')}<div class="correct-text"><b>解析</b><p>${q.explanation?escapeHTML(q.explanation):'原判断题库只给出正误答案，未附逐题解析。'}</p><b>思考步骤：</b>${escapeHTML(q.step)}</div>${q.risk?`<div class="warning-text"><b>⚑ ${escapeHTML(q.risk.level)}：</b>${escapeHTML(q.risk.issue)}<br>建议：${escapeHTML(q.risk.advice)}</div>`:''}${renderCommentBlock(id,'row')}</div>`:''}<div class="q-row-actions"><button class="btn btn-sm" onclick='markFromBrowse(${JSON.stringify(id)})'>${data.bookmarks.includes(id)?'★':'☆'} 收藏</button><button class="btn btn-sm" onclick='expandedRow=${expand?'null':JSON.stringify(id)};render()'>${expand?'收起解析 / 评论':'查看解析'}</button><button class="btn btn-sm btn-light" onclick='expandedRow=${JSON.stringify(id)};render();document.querySelector("#question-row-"+String(${JSON.stringify(id)})+" .comment-box")?.scrollIntoView({behavior:"smooth",block:"nearest"})'>💬 评论 ${((data.comments[id]||[]).length)||''}</button><button class="btn btn-light btn-sm" onclick='startSession("single",${JSON.stringify(id)})'>做这道题 →</button></div></div>`}).join('')}

let commentDrafts={};function rememberCommentDraft(id,context){const key=String(id)+"-"+context;const node=document.getElementById("comment-text-"+String(id).replace(/[^a-zA-Z0-9]/g,"")+"-"+context);if(node)commentDrafts[key]=node.value;}
function renderCommentBlock(id,context){const list=data.comments[id]||[],key=String(id).replace(/[^a-zA-Z0-9]/g,'')+'-'+context;return `<section class="comment-box"><div class="comment-heading"><b>💬 个人评论 / 解题笔记</b><span>${list.length}条 · 仅保存在本机</span></div>${list.length?list.map((c,i)=>`<div class="comment-item"><div class="comment-avatar">${escapeHTML((c.author||'我').slice(0,1))}</div><div class="comment-main"><div class="comment-meta"><b>${escapeHTML(c.author||'我')}</b><time>${new Date(c.at).toLocaleString('zh-CN')}</time><button class="text-link" onclick='editComment(${JSON.stringify(id)},${i})'>编辑</button><button class="text-link" onclick='deleteComment(${JSON.stringify(id)},${i})'>删除</button></div><p>${escapeHTML(c.text).replace(/\n/g,'<br>')}</p></div></div>`).join(''):'<div class="comment-empty">这里还没有笔记。写下你为什么做错、选项的陷阱或自己的记忆口诀。</div>'}<div class="comment-editor"><label class="smallprint">昵称（本机显示）</label><input class="comment-name" id="comment-name-${key}" maxlength="20" value="${escapeHTML(data.nickname||'我')}" placeholder="称呼"/><textarea id="comment-text-${key}" maxlength="1000" rows="3" oninput='rememberCommentDraft(${JSON.stringify(id)},${JSON.stringify(context)})' placeholder="例如：我误把精确率当成召回率。正确公式是……">${escapeHTML(commentDrafts[String(id)+"-"+context]||"")}</textarea><div class="comment-editor-bottom"><span>可以多次添加、逐条删除；导出学习备份时一起保存。</span><button class="btn btn-primary btn-sm" onclick='postComment(${JSON.stringify(id)},${JSON.stringify(context)})'>发布个人评论</button></div></div></section>`}
function postComment(id,context){const key=String(id).replace(/[^a-zA-Z0-9]/g,'')+'-'+context;const input=document.getElementById('comment-text-'+key),name=document.getElementById('comment-name-'+key);const value=input?.value.trim();if(!value){toast('请先填写评论内容');return}if(value.length>1000){toast('最多1000字');return}data.nickname=(name?.value||'我').trim().slice(0,20)||'我';delete commentDrafts[String(id)+"-"+context];(data.comments[id]||(data.comments[id]=[])).push({text:value,author:data.nickname,at:Date.now()});persist();render();toast('个人评论已保存')}
function editComment(id,index){const entry=data.comments[id]?.[index];if(!entry)return;const value=prompt('编辑这条个人评论（最多1000字）',entry.text);if(value==null)return;const trimmed=value.trim();if(!trimmed||trimmed.length>1000){toast('请填写1～1000字评论');return}entry.text=trimmed;entry.editedAt=Date.now();persist();render();toast('个人评论已更新')}
function deleteComment(id,index){if(!confirm('删除这条个人评论？'))return;const list=data.comments[id];if(!list||!list[index])return;list.splice(index,1);persist();render();toast('评论已删除')}

function markFromBrowse(id){let i=data.bookmarks.indexOf(id);if(i<0)data.bookmarks.push(id);else data.bookmarks.splice(i,1);persist();render();toast(i<0?'已收藏':'已取消收藏')}
function categoryStats(mode){const all=mode==='mc'?QUESTIONS:mode==='judge'?JUDGMENTS:[...QUESTIONS,...JUDGMENTS];return CATEGORIES.map(c=>{const qs=all.filter(q=>q.category===c),records=qs.flatMap(q=>historyFor(q.id));const right=records.filter(x=>x.ok).length;return {category:c,items:qs.length,seen:qs.filter(q=>practiced(q.id)).length,attempts:records.length,right,wrong:records.length-right,accuracy:pct(right,records.length)}})}
function renderReport(){
 const rs=categoryStats(reportMode),sorted=[...rs].sort((a,b)=>b.wrong-a.wrong||a.accuracy-b.accuracy||b.attempts-a.attempts),has=sorted.filter(r=>r.attempts>0),most=sorted.filter(r=>r.attempts>0).slice(0,3),least=[...has].sort((a,b)=>a.wrong-b.wrong||b.accuracy-a.accuracy||b.attempts-a.attempts).slice(0,3),j=JUDGMENTS.flatMap(q=>historyFor(q.id)),sess=[...data.sessions].reverse();
 return `<div class="eyebrow">LEARNING ANALYTICS</div><h1 class="page-title">学习报告 · 错在哪里一目了然</h1><p class="page-desc">知识板块默认按答错数量从高到低排序；看完即可一键去专项训练，或进入该板块的错题强化。</p><div class="stats">${quickStat('单选题已学',QUESTIONS.filter(q=>practiced(q.id)).length,'/300',`单选正确率 ${pct(QUESTIONS.flatMap(q=>historyFor(q.id)).filter(x=>x.ok).length,QUESTIONS.flatMap(q=>historyFor(q.id)).length)}%`,'▦')}${quickStat('判断题已学',JUDGMENTS.filter(q=>practiced(q.id)).length,'/300',`累计正确率 ${pct(j.filter(x=>x.ok).length,j.length)}%`,'☑')}${quickStat('练习报告',sess.length,'份','已完成并自动存档的轮次','▤')}${quickStat('错题待强化',[...QUESTIONS,...JUDGMENTS].filter(q=>needsReview(q.id)).length,'题','单选＋判断','↺')}</div><div class="panel boxpad"><div class="section-head" style="margin-top:0"><h3>知识板块答题表现</h3><div class="tabs" style="margin:0">${[['all','全部'],['mc','单选'],['judge','判断']].map(([v,l])=>`<button class="tab ${reportMode===v?'active':''}" onclick="reportMode='${v}';render()">${l}</button>`).join('')}</div></div><div class="report-table"><div class="report-header"><span>知识板块</span><span>已练/总数</span><span>答对</span><span>答错</span><span>正确率</span><span>去学习</span></div>${sorted.map(r=>{const pending=categoryPendingCount(r.category,reportMode);return `<div class="report-table-row"><div><b>${escapeHTML(r.category)}</b><div class="acc-track"><i style="width:${r.accuracy}%"></i></div></div><span>${r.seen}/${r.items}</span><span class="good">${r.right}</span><span class="danger">${r.wrong}</span><strong>${r.attempts?r.accuracy+'%':'暂无'}</strong><div class="learn-actions"><button class="btn btn-sm btn-light" onclick='startCategoryFromReport(${JSON.stringify(r.category)},${JSON.stringify(reportMode)})'>专项训练</button><button class="btn btn-sm" onclick='openCategoryMistakes(${JSON.stringify(r.category)},${JSON.stringify(reportMode)})' ${pending?'':'disabled'}>${pending?`错题强化（${pending}）`:'暂无错题'}</button></div></div>`}).join('')}</div><p class="smallprint">表格已按“答错数量”从高到低排序；“答对/答错”按历史每次作答计数；“已练/总数”按去重题目计数。未做过的题目不算错误。样本较少时请勿仅凭正确率判断掌握程度。</p></div><div class="report-grid" style="margin-top:17px"><div class="panel boxpad"><h3 class="dash-title">🔴 错题最多的板块</h3>${most.length?most.map((r,i)=>`<div class="diagnostic"><b>${i+1}. ${escapeHTML(r.category)}</b><span>错 ${r.wrong} 次 · 正确率 ${r.accuracy}% · 已答 ${r.attempts} 次</span></div>`).join(''):'<div class="smallprint">还没有答题数据</div>'}<p class="smallprint">优先复习“错题数较多且已练习次数较多”的板块。</p></div><div class="panel boxpad"><h3 class="dash-title">🟢 错题较少的板块</h3>${least.length?least.map((r,i)=>`<div class="diagnostic"><b>${i+1}. ${escapeHTML(r.category)}</b><span>错 ${r.wrong} 次 · 正确率 ${r.accuracy}% · 已答 ${r.attempts} 次</span></div>`).join(''):'<div class="smallprint">还没有答题数据</div>'}<p class="smallprint">少错不等于已掌握，尤其是尚未练习充分的专题。</p></div></div><div class="panel boxpad" style="margin-top:17px"><div class="section-head" style="margin-top:0"><h3>每次练习的独立报告</h3><span class="smallprint">最近 ${Math.min(30,sess.length)} / ${sess.length} 次</span></div>${sess.length?sess.slice(0,30).map(r=>`<button class="session-row" onclick='reportSelected=${JSON.stringify(r.id)};setPage("sessionResult")'><span><b>${escapeHTML(r.name)}</b><small>${new Date(r.at).toLocaleString('zh-CN')}</small></span><span>对 ${r.correct} / 答 ${r.answered}</span><strong>${sessionAccuracy(r)}%</strong><span style="color:var(--brand)">查看报告 →</span></button>`).join(''):'<div class="empty"><h3>还没有已完成的练习报告</h3><p>任意练习做完或手动结束，就会自动保存本轮表现。</p></div>'}</div>`}


function renderSettings(){return `<div class="eyebrow">DATA & SETTINGS</div><h1 class="page-title">学习数据与设置</h1><p class="page-desc">知题 ZHITI 离线版：单选、判断、混合训练；学习记录保存在当前浏览器，可备份和恢复。此版本仅含原创演示题。</p><div class="panel boxpad settings-box"><h3 class="dash-title">数据备份与恢复</h3><p class="smallprint">公开演示版使用独立本地存储，不会覆盖你的 旧版 学习记录。学习记录、评论与收藏仅保存在当前浏览器，本版没有云同步。</p><div class="note" style="margin:14px 0"><strong>当前浏览器实际记录：</strong> ${describeCounts(backupCounts(data))}<p class="smallprint" style="margin-bottom:0">提示：如果全部为0，当前浏览器还没有学习记录。</p></div><div class="action-row"><button class="btn btn-primary" onclick="exportBackup()">↓ 导出全部学习数据</button><button class="btn" onclick="document.getElementById('backup-file').click()">↑ 导入学习数据（合并）</button></div><div class="note" style="margin-top:16px"><b>备份兼容说明：</b>公开版只导入公开版自身导出的学习备份。旧版 题号对应另一套题库，不能直接导入，以免学习记录被关联到不同题目。</div><div class="divider"></div><h3 class="dash-title">题库管理</h3><p class="smallprint">题库文件仅在此浏览器本地导入和保存，不会上传。导入前请确认你有权使用题目内容。更换题库前请导出学习记录；为避免题号错配，有答题、收藏或评论记录时系统会拒绝导入。</p><div class="action-row"><button class="btn btn-sm" onclick="document.getElementById('mc-bank-file').click()">导入单选题 JSON</button><button class="btn btn-sm" onclick="downloadCustomTemplate('mc')">下载单选题模板</button><button class="btn btn-sm" onclick="document.getElementById('judge-bank-file').click()">导入判断题 JSON</button><button class="btn btn-sm" onclick="downloadCustomTemplate('judge')">下载判断题模板</button><button class="btn btn-sm" onclick="downloadBank()">导出当前单选题库</button><button class="btn btn-sm" onclick="downloadJudgments()">导出当前判断题库</button></div><p class="smallprint">另外预留独立多选题库，当前已导入 ${(data.multiQuestions||[]).length} 道，<button class="text-link" onclick="setPage('multiBank')">多选题库与导入入口 →</button></p><p class="smallprint"><b>题库说明：</b>本演示版仅包含少量原创示例题，不包含原 AI 训练师题库。请仅导入你拥有合法使用权的题库内容。</p><div class="action-row">${data.legacyJudgments?.length?'<button class="btn btn-sm" onclick="downloadLegacyJudgments()">下载旧版判断题学习记录归档</button>':''}</div><div class="divider"></div><h3 class="dash-title">重置全部学习数据</h3><p class="smallprint">清空练习历史、收藏、个人评论及每轮学习报告。此操作无法撤销。</p><button class="btn btn-sm" style="color:#bf5252" onclick="resetData()">清空全部学习记录</button></div>`}

function downloadLegacyJudgments(){downloadFile('知题_旧版衍生判断题历史归档.json',JSON.stringify(data.legacyJudgments,null,2));toast('旧版120题的个人记录已归档下载')}
function downloadJudgments(){downloadFile('知题_判断题库.json',JSON.stringify(JUDGMENTS,null,2));toast('已导出判断题库')}
function downloadFile(name,content,type){const blob=new Blob([content],{type:type||'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){const counts=backupCounts(data);if(!counts.total){if(!confirm('⚠ 目前没有任何答题或收藏记录。导出的备份将是空的。仍要导出吗？'))return;}downloadFile('知题_学习备份_'+today()+'.json',JSON.stringify({app:'zhiti-open-source-v1',exportedAt:new Date().toISOString(),data},null,2));toast('已导出学习记录，请妥善保存')}
function downloadBank(){downloadFile('知题_单选题库.json',JSON.stringify(QUESTIONS,null,2));toast('已导出题库')}
function backupCounts(d){
  const hist=d?.history&&typeof d.history==='object'&&!Array.isArray(d.history)?d.history:{};
  const attempts=Object.values(hist).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  const questions=Object.values(hist).filter(a=>Array.isArray(a)&&a.length).length;
  const bookmarks=Array.isArray(d?.bookmarks)?d.bookmarks.length:0;
  const sessions=Array.isArray(d?.sessions)?d.sessions.length:0;
  const exams=Array.isArray(d?.exams)?d.exams.length:0;
  const comments=Object.values(d?.comments||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  const active=Object.keys(d?.session?.answers||{}).length;const multiBank=Array.isArray(d?.multiQuestions)?d.multiQuestions.length:0;
  return {attempts,questions,bookmarks,sessions,exams,comments,active,multiBank,total:attempts+bookmarks+sessions+exams+comments+active+multiBank};
}
function describeCounts(c){return `学习题目 ${c.questions} 道、答题记录 ${c.attempts} 条、收藏 ${c.bookmarks} 道、考试 ${c.exams} 次、练习报告 ${c.sessions} 份、评论 ${c.comments} 条、当前未完成作答 ${c.active} 道、多选题库 ${c.multiBank||0} 道`;}
function validBankId(id){return /^(?:[1-9]|[1-9]\d|[12]\d\d|300|J(?:00[1-9]|0[1-9]\d|[12]\d\d|300)|M\d{3,5})$/.test(String(id))}
function mergeRecords(a,b){const arr=Array.isArray(a)?a:[], incoming=Array.isArray(b)?b:[],seen=new Set(arr.map(x=>JSON.stringify(x)));const out=arr.slice();for(const x of incoming){const k=JSON.stringify(x);if(!seen.has(k)){seen.add(k);out.push(x)}}return out;}
function unionByFingerprint(a,b,fn){const out=Array.isArray(a)?a.slice():[],seen=new Set(out.map(fn));for(const x of Array.isArray(b)?b:[]){const k=fn(x);if(!seen.has(k)){seen.add(k);out.push(x)}}return out;}
function mergeStudyData(base,more){
  const result=JSON.parse(JSON.stringify(base));
  result.correctEver={...(result.correctEver||{}),...(more.correctEver||{})};
  result.multiQuestions=Array.isArray(result.multiQuestions)?result.multiQuestions:[];
  for(const incoming of more.multiQuestions||[]){const old=result.multiQuestions.find(q=>q.id===incoming.id);if(old){if(old.q!==incoming.q||old.answer!==incoming.answer||JSON.stringify(old.options)!==JSON.stringify(incoming.options))throw Error('多选题库同号题目内容不同：'+incoming.id)}else result.multiQuestions.push(incoming)}
  for(const [id,h] of Object.entries(more.history||{})){if(!validBankId(id)||!Array.isArray(h))continue;result.history[id]=mergeRecords(result.history[id],h);}
  result.bookmarks=[...new Set([...(result.bookmarks||[]),...(more.bookmarks||[])].filter(validBankId))].map(id=>/^\d+$/.test(String(id))?Number(id):id);
  for(const [id,list] of Object.entries(more.comments||{})){if(!validBankId(id)||!Array.isArray(list))continue;result.comments[id]=unionByFingerprint(result.comments[id],list,c=>[c.text,c.author,c.at].join('|'));}
  result.exams=unionByFingerprint(result.exams,more.exams,x=>JSON.stringify([x.at,x.total,x.correct,x.answered]));
  result.sessions=unionByFingerprint(result.sessions,more.sessions,x=>x.id||JSON.stringify([x.at,x.mode,x.answers]));
  result.legacyJudgments=unionByFingerprint(result.legacyJudgments,more.legacyJudgments,x=>JSON.stringify([x.archivedAt,x.bank]));
  result.seqCursor=Math.max(Number(result.seqCursor)||0,Number(more.seqCursor)||0);result.seqCursorJudge=Math.max(Number(result.seqCursorJudge)||0,Number(more.seqCursorJudge)||0);result.seqCursorMixed=Math.max(Number(result.seqCursorMixed)||0,Number(more.seqCursorMixed)||0);
  result.lastSessionId=result.sessions.some(x=>x.id===result.lastSessionId)?result.lastSessionId:result.sessions.at(-1)?.id||null;
  const oldActive=Object.keys(result.session?.answers||{}).length;
  const newActive=Object.keys(more.session?.answers||{}).length;
  if(newActive>oldActive&&!more.session.finished&&Array.isArray(more.session.ids)&&more.session.ids.every(validBankId))result.session=more.session;
  result.version=6;result.judgmentBankVersion='zhiti-demo-v1';
  return result;
}
function safelySaveStudyData(candidate){
  const serialized=JSON.stringify(candidate);
  localStorage.setItem(LS_KEY,serialized);
  const recovered=JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(!recovered||JSON.stringify(recovered)!==serialized)throw Error('浏览器没有正确写入本地存储，请不要关闭旧版。');
  data=candidate;
}
async function importBackup(event){
 const file=event.target.files?.[0];event.target.value='';if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());
  if(parsed.app!=='zhiti-open-source-v1'||!parsed.data||typeof parsed.data.history!=='object'||Array.isArray(parsed.data.history)||!Array.isArray(parsed.data.bookmarks))throw Error('文件不是有效的知题学习备份');
  const incoming=parsed.data,inCounts=backupCounts(incoming);if(Array.isArray(incoming.multiQuestions)&&incoming.multiQuestions.length&&normalizeMultiQuestions({questions:incoming.multiQuestions}).length!==incoming.multiQuestions.length)throw Error('多选题库校验失败');
  if((incoming.history&&Object.entries(incoming.history).some(([id,arr])=>!validBankId(id)||!Array.isArray(arr)))|| (incoming.bookmarks||[]).some(id=>!validBankId(id)))throw Error('备份包含未知题号或无效答题记录，已拒绝导入');
  if(!inCounts.total){alert(`导入已中止：此文件没有任何有效的学习记录。\n\n文件内部版本：V${incoming.version||'未知'}；${describeCounts(inCounts)}。\n\n你之前在V1完成的历史记录不在这份文件中。请返回真正记录过练习的V1网页，在原浏览器中检查学习报告后重新导出。\n\n为避免覆盖已有学习进度，系统没有写入这个空备份。`);return}
  if(!Object.keys(incoming.history).every(id=>validBankId(id)))throw Error('存在未知题号：该备份不适用于当前题库，请不要强行导入');
  const current=backupCounts(data);
  if(!confirm(`检测到有效知题备份（版本 V${incoming.version||'未知'}）：\n${describeCounts(inCounts)}。\n\n当前旧版：${describeCounts(current)}。\n\n点击「确定」将【合并】学习记录，而不是清空现有记录。重复导入相同文件不会重复计入相同记录。`))return;
  const currentData=data;
  let migrated;
  try{data=JSON.parse(JSON.stringify(incoming));migrate();migrated=data;}finally{data=currentData}
  const candidate=mergeStudyData(data,migrated);
  safelySaveStudyData(candidate);
  latestExam=null;reportSelected=null;setPage('home');
  const restored=backupCounts(data);
  alert(`导入完成，已经写入并重新读取本地存储。\n现在共计：${describeCounts(restored)}。\n\n请检查首页与「学习报告」。当前备份数据不会被清空。`);
 }catch(e){alert('导入失败，原学习记录未被主动替换：'+e.message)}
}

function resetData(){if(!confirm('确认清空全部学习记录、个人评论和轮次报告？此操作不可恢复！'))return;if(!confirm('请再次确认：全部个人学习数据将被清空。'))return;data=freshData();latestExam=null;reportSelected=null;persist();setPage('home');toast('全部学习记录已重置')}
function toggleMobile(){document.getElementById('sidebar').classList.toggle('mobile-open');document.getElementById('backdrop').classList.toggle('open')}
function closeMobile(){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('backdrop').classList.remove('open')}
document.addEventListener('keydown',e=>{if(page!=='practice'||e.ctrlKey||e.metaKey||e.altKey||/input|textarea|select/i.test(document.activeElement?.tagName||''))return;const key=e.key.toUpperCase();if(KEYS.includes(key)){e.preventDefault();const q=byId(data.session?.ids[data.session?.idx]);if(q?.kind!=='multi'&&q?.options?.length>KEYS.indexOf(key))chooseAnswer(key)}else if(e.key==='Enter'){e.preventDefault();moveQuestion(1)}});
setInterval(()=>{if(page==='practice'&&data.session?.type==='mock'&&!data.session.finished){const remaining=Math.max(0,Math.ceil((data.session.startedAt+data.session.duration-Date.now())/1000));const timer=document.getElementById('exam-clock');if(timer)timer.textContent='⏱ '+formatSeconds(remaining);if(remaining===0)finishExam()}},1000);
initNav();render();persist();
</script>
