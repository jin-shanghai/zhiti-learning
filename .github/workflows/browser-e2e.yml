name: Browser E2E
on:
  push:
    branches: [main]
  pull_request:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser interaction regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zhiti-e2e.log 2>&1 &
          node tests/browser_e2e.js
          node tests/ai_features_e2e.js
          node tests/secure_ai_e2e.js
