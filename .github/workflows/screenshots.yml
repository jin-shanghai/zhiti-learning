name: Refresh Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/capture-screenshots.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real product screens
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zhiti-http.log 2>&1 &
          node scripts/capture-screenshots.js
      - name: Commit refreshed screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo 'Screenshots are already current.'
          else
            git commit -m 'docs: refresh product screenshots'
            git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          fi
