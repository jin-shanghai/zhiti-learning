name: Refresh Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/capture-screenshots.js'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/capture-screenshots.js'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps: &audit_steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real product screens
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zhiti-http.log 2>&1 &
          node scripts/capture-screenshots.js
      - name: Commit refreshed screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo 'Screenshots are already current.'
          else
            git commit -m 'docs: refresh product screenshots'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              echo "Screenshot push attempt $attempt failed; retrying."
            done
            echo 'Unable to publish refreshed screenshots after 3 attempts.' >&2
            exit 1
          fi

  capture-main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps: *audit_steps
