name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - tests/**
      - index.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps: &audit_steps
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Confirm release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable semantic version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate HTML, question bank and data regressions
        run: |
          python3 tests/smoke_test.py
          node tests/regression_test.js
          node tests/import_test.js
          python3 tests/ci_config_test.py

      - name: Install headless Chromium for interaction test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser interaction regression (desktop + mobile viewport)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zhiti-e2e.log 2>&1 &
          node tests/browser_e2e.js
          node tests/ai_features_e2e.js
          node tests/secure_ai_e2e.js

      - name: Package offline release downloads
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p "dist/zhiti-v$version/assets" "dist/zhiti-v$version/docs"
          cp index.html "dist/zhiti-v$version/index.html"
          cp assets/cover.svg "dist/zhiti-v$version/assets/cover.svg"
          cp README.md LICENSE NOTICE CONTENT_RIGHTS.md "dist/zhiti-v$version/"
          cp docs/usage.md docs/question-bank-format.md "dist/zhiti-v$version/docs/"
          cp index.html "dist/zhiti-v$version-offline.html"
          (cd dist && zip -qr "zhiti-v$version-offline.zip" "zhiti-v$version")
          (cd dist && shasum -a 256 "zhiti-v$version-offline.html" "zhiti-v$version-offline.zip" > SHA256SUMS.txt)
          test -s "dist/zhiti-v$version-offline.html"
          test -s "dist/zhiti-v$version-offline.zip"
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; publication was already successful; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" \
            "dist/zhiti-v${{ steps.version.outputs.version }}-offline.html" \
            "dist/zhiti-v${{ steps.version.outputs.version }}-offline.zip" \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "知题 ZHITI · v${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --latest

  verify-and-release-main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps: *audit_steps
